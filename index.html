<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TAMA</title>
<style>
:root { --bg: #141317; --fg: #efe9dc; --btn: #2a2830; --btn-on: #3d3a48; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app { max-width: 640px; margin: 0 auto; padding: 0 16px 24px; }
h1 { font-size: 15px; letter-spacing: .2em; margin: 14px 0 0; text-align: center; font-weight: 600; opacity: .7; }
canvas { display: block; width: 100%; aspect-ratio: 4 / 3; margin-top: 10px; border-radius: 8px; background: #000; image-rendering: pixelated; touch-action: manipulation; }
.row { display: flex; gap: 8px; margin-top: 8px; }
button { flex: 1; min-width: 0; padding: 15px 2px; font-size: 16px; border: 0; border-radius: 10px; background: var(--btn); color: var(--fg); font-family: inherit; }
button.on, button:active { background: var(--btn-on); }
p { font-size: 13px; line-height: 1.45; opacity: .65; margin: 14px 2px 0; }
</style>
</head>
<body>
<div id="app">
  <h1>TAMA</h1>
  <canvas id="tela" width="320" height="240"></canvas>
  <div class="row">
    <button id="bA">◀ andar</button>
    <button id="bC">andar ▶</button>
  </div>
  <div class="row">
    <button id="bUp">▲ faixa</button>
    <button id="bDown">faixa ▼</button>
    <button id="bZoomOut">zoom −</button>
    <button id="bZoomIn">zoom +</button>
  </div>
  <p>Este é o seu dino. Segure ◀ ou ▶ para andar; dois toques seguidos andam sem parar. Toque no dino para ver o status e numa moita grande para ele comer. As faixas só mudam com o zoom afastado. Cansado, toque na cabeça para ele dormir.</p>
</div>

  constructor() { this.down = false; this.pressed = false; this.released = false; }
  press() { if (!this.down) { this.down = true; this.pressed = true; } }
  release() { if (this.down) { this.down = false; this.released = true; } }
  clear() { this.pressed = this.released = false; }
}
const btns = [new Btn(), new Btn()];  // [A, C]
let walkPressAt = 0, walkPressRight = false, walkPressUsed = false, walkClicked = false, walkClickRight = false, walkClickAt = 0;
function updateWalkButton() {
  const t = now();
  if (st === 'COMER' || walkMode === WALK.AUTO) return;
  if (tired || st === 'DESCANSAR') {
    if ((btns[0].pressed || btns[1].pressed) && (st === 'CANSADO' || st === 'KEEP')) enter('NAO');
    walkMode = WALK.OFF; walkClicked = false;
    return;
  }
  for (let k = 0; k < 2; k++) {
    const right = k === 1, btn = btns[k];
    if (btn.pressed) {
      walkPressAt = t; walkPressRight = right; walkPressUsed = true;
      if (walkMode === WALK.LOOP) walkMode = WALK.OFF;
      else if (walkClicked && walkClickRight === right && t - walkClickAt < WALK_DOUBLE_CLICK_MS) { walkMode = WALK.LOOP; walkRight = right; }
      else walkPressUsed = false;
      walkClicked = false;
    }
    if (right !== walkPressRight) continue;
    if (btn.down && !walkPressUsed && walkMode === WALK.OFF && t - walkPressAt >= WALK_HOLD_MS) { walkMode = WALK.HOLD; walkRight = right; }
    if (btn.released) {
      if (walkMode === WALK.HOLD) walkMode = WALK.OFF;
      else if (!walkPressUsed) { walkClicked = true; walkClickRight = right; walkClickAt = t; }
    }
  }
}

// ---------- painel de status ----------
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1, u = x - 1; return 1 + c3 * u * u * u + c1 * u * u; };
const easeOutCubic = x => 1 - (1 - x) ** 3;
const panelT = () => panelStep / IC.openFrames;
function groupSlots(g) {
  switch (g) {
    case 0: return petSlots(pet.vida);
    case 1: return petSlots(pet.energy);
    case 2: return petSlots(100 - pet.hunger);
    default: return petSlots(pet.happy);
  }
}
function plateFull(g, j) {
  const t = now(), slots = groupSlots(g);
  if (g === 0 && j === heartBlinkSlot) {
    const phase = Math.floor((t - heartBlinkStart) / HEART_BLINK_MS);
    if (phase < 6) return { full: phase % 2 === 0, dx: 0 };
    heartBlinkSlot = -1;
  }
  if (g === 1 && slots === 1 && j === 0) return { full: Math.floor(t / STAMINA_WARN_MS) % 2 === 0, dx: 0 };
  return { full: j < slots, dx: g === 2 && slots === 1 && j === 0 ? (Math.floor(t / FRUIT_SWAY_MS) % 2 ? 1 : -1) : 0 };
}
function drawPlate(x, y, icon, dx) {
  ctx.fillStyle = '#EFE9DC'; ctx.fillRect(x + 1, y + 1, PLATE - 2, PLATE - 2);
  ctx.fillStyle = '#141317';
  ctx.fillRect(x + 1, y, PLATE - 2, 1); ctx.fillRect(x + 1, y + PLATE - 1, PLATE - 2, 1);
  ctx.fillRect(x, y + 1, 1, PLATE - 2); ctx.fillRect(x + PLATE - 1, y + 1, 1, PLATE - 2);
  ctx.drawImage(icon, x + 2 + dx, y + 2, 18, 18);
}
function drawPlates() {
  const t = panelT(), margin = IC.radius + PLATE / 2 + 2;
  const pcx = dinoCenterX(), pcy = clamp(dinoTop() + (DN.h >> 1) * dinoScale(), margin, H - margin);
  for (let g = 0; g < 4; g++) {
    const tg = clamp((t - g * 0.08) / 0.76, 0, 1);
    if (tg <= 0) continue;
    const r = IC.radius * (panelOpen ? easeOutBack(tg) : tg);
    for (let j = 0; j < 3; j++) {
      const a = (GROUP_ANGLE[g] + ITEM_ANGLE[j]) * Math.PI / 180;
      const { full, dx } = plateFull(g, j);
      drawPlate(pcx + Math.round(r * Math.cos(a)) - PLATE / 2, pcy + Math.round(r * Math.sin(a)) - PLATE / 2, full ? ICONS[g].cheio : ICONS[g].vazio, dx);
    }
  }
}
function updatePanelAnim() {
  const target = panelOpen ? IC.openFrames : 0, t = now();
  if (panelStep === target || t - lastPanelTick < PANEL_TICK_MS) return;
  lastPanelTick = t;
  panelStep += panelOpen ? 1 : -1;
}

// ---------- desenho ----------
function draw() {
  if (worldDirty) renderWorldNow();
  const dimA = panelStep > 0 ? 0.5 * easeOutCubic(panelT()) : 0;
  ctx.drawImage(wCv, 0, 0);
  if (dimA) { ctx.fillStyle = `rgba(0,0,0,${dimA})`; ctx.fillRect(0, 0, W, H); }
  const s = dinoScale(), f = currentFrame();
  ctx.drawImage(facingRight && st !== 'VIRAR' ? mirror(f) : f, dinoCanvasX(), dinoTop(), DN.w * s, DN.h * s);
  if (dimA) {
    tCtx.globalCompositeOperation = 'source-over'; tCtx.clearRect(0, 0, W, H); tCtx.drawImage(fCv, 0, 0);
    tCtx.globalCompositeOperation = 'source-atop'; tCtx.fillStyle = `rgba(0,0,0,${dimA})`; tCtx.fillRect(0, 0, W, H);
    ctx.drawImage(tCv, 0, 0);
  } else ctx.drawImage(fCv, 0, 0);
  if (floater) {
    const t = (now() - floater.t0) / FLOAT_MS;
    if (t >= 1) floater = null;
    else ctx.drawImage(ICONS[2].cheio, floater.x, Math.round(floater.y0 - FLOAT_RISE * t), 18, 18);
  }
  if (panelStep > 0) drawPlates();
}

// ---------- toque na tela ----------
function onTap(x, y) {
  if (!panelOpen && tryEat(x, y)) return;
  const s = dinoScale(), headX = faceX(dinoCanvasX(), HEAD_W * s);
  const onHead = x >= headX && x < headX + HEAD_W * s && y >= dinoTop() && y < dinoTop() + HEAD_H * s;
  if (onHead && tired && (st === 'CANSADO' || st === 'NAO')) { enter('DESCANSAR'); return; }
  const onDino = x >= dinoLeft() && x < dinoLeft() + (DN.w - 2 * DN.pad) * s && y >= dinoTop() && y < feetY;
  if (onDino) { panelOpen = !panelOpen; lastPanelTick = now() - PANEL_TICK_MS; }
  else if (panelOpen) { panelOpen = false; lastPanelTick = now() - PANEL_TICK_MS; }
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  onTap((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  e.preventDefault();
});

// ---------- botões da página ----------
function hold(id, k) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { btns[k].press(); b.classList.add('on'); b.setPointerCapture(e.pointerId); e.preventDefault(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => { btns[k].release(); b.classList.remove('on'); });
}
hold('bA', 0); hold('bC', 1);
const tap = (id, fn) => document.getElementById(id).addEventListener('click', fn);
tap('bUp', () => requestBand(-1)); tap('bDown', () => requestBand(1));
tap('bZoomOut', () => stepZoom(-1)); tap('bZoomIn', () => stepZoom(1));
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- partida ----------
function loop() {
  requestAnimationFrame(loop);
  updateWalkButton();
  btns.forEach(b => b.clear());
  updateStats();
  updatePlants();
  updateDino();
  updatePanelAnim();
  draw();
}
const SAVE_KEY = 'tama.pet';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(pet)); } catch (e) { /* sem armazenamento */ } }
function start() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { /* primeira vez */ }
  if (saved) pet = { ...pet, ...saved };
  tired = petSlots(pet.energy) <= 1;
  initPlants();
  enter(idleState());
  lastStatsTick = lastFrame = now();
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  loop();
}
window.__estado = () => ({ st, fr, walkMode, walkRight, facingRight, camX: +camX.toFixed(1), band: dinoBand, feetY, tired, hunger: +pet.hunger.toFixed(1), energy: +pet.energy.toFixed(1), cam: camMode });  // para testes
start();
})();
</script>
</body>
